common:
  tags: app_platform
  harness: ztest
  # One case hands a service a kernel pointer and expects the oops.
  ignore_faults: true
  # The device services are exercised against emulated instances, so the suite
  # runs anywhere that offers user mode rather than only on the boards that
  # happen to carry this hardware.
  platform_allow:
    - qemu_x86
tests:
  app_platform.devices:
    timeout: 60
  app_platform.devices.own_fatal_handler:
    timeout: 60
    extra_configs:
      - CONFIG_APP_PLATFORM_FATAL_HANDLER=n
