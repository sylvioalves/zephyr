CONFIG_ZTEST=y
CONFIG_USERSPACE=y
CONFIG_TASK_WDT=y
CONFIG_LOG=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096

CONFIG_APP_PLATFORM=y
CONFIG_APP_PLATFORM_MAX_APPS=4
CONFIG_APP_PLATFORM_SERVICES=y

CONFIG_I2C=y
CONFIG_I2C_EMUL=y
CONFIG_EMUL=y
CONFIG_EEPROM=y
CONFIG_EEPROM_AT24=y
CONFIG_EEPROM_AT2X_EMUL=y
CONFIG_EEPROM_INIT_PRIORITY=75
CONFIG_DAC=y
CONFIG_RTC=y
CONFIG_REGULATOR=y
CONFIG_STEPPER=y
CONFIG_CHARGER=y
CONFIG_FUEL_GAUGE=y
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_ADC=y
CONFIG_SENSOR=y
CONFIG_LED_STRIP=y
CONFIG_DISPLAY=y
# The capture display replaces the board's ramfb, so QEMU needs no window.
CONFIG_QEMU_RAMFB_DISPLAY=n
CONFIG_QEMU_EXTRA_FLAGS="-display none"

CONFIG_APP_PLATFORM_EEPROM=y
CONFIG_APP_PLATFORM_DAC=y
CONFIG_APP_PLATFORM_RTC=y
CONFIG_APP_PLATFORM_REGULATOR=y
CONFIG_APP_PLATFORM_STEPPER=y
CONFIG_APP_PLATFORM_POWER=y
CONFIG_APP_PLATFORM_GPIO=y
CONFIG_APP_PLATFORM_IO=y
CONFIG_APP_PLATFORM_EVENTS=y
CONFIG_APP_PLATFORM_PERIPH=y
CONFIG_APP_PLATFORM_MOTION=y
CONFIG_APP_PLATFORM_RGB=y
CONFIG_APP_PLATFORM_DISPLAY=y
CONFIG_SERIAL=y
CONFIG_UART_EMUL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_SPI=y
CONFIG_SPI_EMUL=y
CONFIG_APP_PLATFORM_BUS=y
CONFIG_CAN=y
CONFIG_APP_PLATFORM_CAN=y
CONFIG_APP_PLATFORM_CAN_LOOPBACK=y
CONFIG_APP_PLATFORM_DISPLAY_XFER_MAX=256
CONFIG_SHARED_MULTI_HEAP=y
CONFIG_APP_PLATFORM_PSRAM=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_APP_PLATFORM_FS=y
CONFIG_APPLICATION_DEFINED_SYSCALL=y
