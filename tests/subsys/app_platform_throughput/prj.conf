CONFIG_ZTEST=y
CONFIG_USERSPACE=y
CONFIG_TASK_WDT=y
CONFIG_LOG=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096

CONFIG_APP_PLATFORM=y
CONFIG_APP_PLATFORM_MAX_APPS=2
CONFIG_APP_PLATFORM_SERVICES=y
CONFIG_APP_PLATFORM_NET=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_LOOPBACK=y
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_MQTT_LIB=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
# The echo servers listen on loopback, so no link to the host is needed.
CONFIG_NET_DRIVERS=y
CONFIG_NET_SLIP_TAP=n
