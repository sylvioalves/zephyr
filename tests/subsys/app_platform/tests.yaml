common:
  tags: app_platform
  harness: ztest
  ignore_faults: true
  # The suites launch real user-mode applications and load signed llext
  # modules from a filesystem, so a target needs userspace, llext, a storage
  # partition and PSA crypto. The Arm targets cover an Armv7-M and an Armv8-M
  # MPU, an Armv8.1-M MPU with more regions, and an AArch64 MMU.
  platform_allow:
    - esp32c5_devkitc/esp32c5/hpcore
    - esp32c6_devkitc/esp32c6/hpcore
    - esp32p4x_function_ev_board/esp32p4/hpcore
    - mps2/an385
    - mps2/an521/cpu0
    - mps3/corstone300/an547
    - qemu_cortex_a53
    - esp32_devkitc/esp32/procpu
tests:
  app_platform.core:
    timeout: 60
    # The Xtensa ESP32 has no user mode.
    platform_exclude:
      - esp32_devkitc/esp32/procpu
    extra_configs:
      - CONFIG_USERSPACE=y
      - CONFIG_MAX_THREAD_BYTES=3
      - CONFIG_PRIVILEGED_STACK_SIZE=3072
  # Supervisor-mode applications: the suites that pit an application against
  # memory protection are left out.
  app_platform.core.no_userspace:
    timeout: 60
    extra_configs:
      - CONFIG_USERSPACE=n
