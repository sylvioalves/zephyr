# Without an entropy driver mbed TLS runs its own DRBG from its heap.
CONFIG_MBEDTLS_HEAP_SIZE=4096
# Ticks match milliseconds, so the test module needs no 64-bit division helper.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_APP_PLATFORM_CPU_AFFINITY=y
# The CPU affinity suite counts thread switch-ins per CPU.
CONFIG_TRACING=y
CONFIG_TRACING_USER=y
