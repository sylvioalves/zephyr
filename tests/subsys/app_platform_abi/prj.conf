CONFIG_ZTEST=y

# Adds the syscall declared in src/renumber_probe.h.
CONFIG_APPLICATION_DEFINED_SYSCALL=y

CONFIG_APP_PLATFORM=y
CONFIG_APP_PLATFORM_MAX_APPS=2
CONFIG_APP_PLATFORM_LOADER=y
# The producer image signs the module with the development key of the
# app_platform test.
CONFIG_APP_PLATFORM_DEV_KEY=y
CONFIG_APP_PLATFORM_DEV_KEY_FILE="../app_platform/keys/app_signing_key.pem"
CONFIG_APP_PLATFORM_SERVICES=y
# The test counts the application faults in its own handler.
CONFIG_APP_PLATFORM_FATAL_HANDLER=n

CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=n

CONFIG_LLEXT=y
CONFIG_LLEXT_HEAP_SIZE=32
CONFIG_LLEXT_TYPE_ELF_RELOCATABLE=y

CONFIG_PSA_CRYPTO=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=4096
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_MBEDTLS_PSA_P256M_DRIVER_ENABLED=y
CONFIG_ENTROPY_GENERATOR=y

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384

# The producer image runs at 10000 ticks per second.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=100
