description: |
  Devices the application platform hands out to applications by index.

  Each list is in index order: the first entry is instance 0 of that service.
  A device that is not listed here is never reachable by an application,
  whatever else the board describes.

  Example:

    app-platform {
        compatible = "zephyr,app-platform";
        gpios = <&gpio0 2 GPIO_ACTIVE_HIGH>, <&gpio0 3 GPIO_ACTIVE_HIGH>;
        line-names = "status", "relay";
        counters = <&timer0 &timer1>;
    };

compatible: "zephyr,app-platform"

include: base.yaml

properties:
  gpios:
    type: phandle-array
    description: GPIO lines applications may drive or watch.

  line-names:
    type: string-array
    description: Names of the GPIO lines, in the order of gpios.

  counters:
    type: phandles
    description: Counter devices.

  dacs:
    type: phandles
    description: DAC devices.

  regulators:
    type: phandles
    description: Regulator devices.

  steppers:
    type: phandles
    description: Stepper motor controller devices.

  sensors:
    type: phandles
    description: |
      Sensor devices backing the sensor service's catalog. The first listed
      device that reports a kind's channel backs that kind.
