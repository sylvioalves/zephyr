# The ESP32-P4 uses the Synopsys DesignWare 10/100/1000 MAC driver instead of
# the legacy ESP32 ethernet driver.
CONFIG_ETH_ESP32=n

# The ESP32-P4 MAC does not implement receive checksum offload, so keep the
# checksum handling in software.
CONFIG_ETH_DWC_ETHER_TX_HW_CHECKSUM=n
CONFIG_ETH_DWC_ETHER_RX_HW_CHECKSUM=n
