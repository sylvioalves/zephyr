sample:
  name: Scoped I2C capability
  description: >
    Grant an application a single I2C address and deny every other address on
    the bus.
tests:
  sample.subsys.app_i2c_scoped:
    tags: app_platform
    platform_allow:
      - esp32c5_devkitc/esp32c5/hpcore
      - esp32c6_devkitc/esp32c6/hpcore
      - qemu_riscv32/qemu_virt_riscv32
      - qemu_riscv32/qemu_virt_riscv32/smp
    harness: console
    harness_config:
      type: one_line
      regex:
        - "done: app could use only its granted address"
