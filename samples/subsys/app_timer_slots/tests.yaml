sample:
  name: Isolated multi-timer application
  description: Run several platform timers at once from one application
tests:
  sample.app_platform.timer_slots:
    platform_allow:
      - esp32c5_devkitc/esp32c5/hpcore
      - esp32c6_devkitc/esp32c6/hpcore
      - qemu_riscv32/qemu_virt_riscv32
      - qemu_riscv32/qemu_virt_riscv32/smp
    tags: app_platform
    harness: console
    harness_config:
      type: one_line
      regex:
        - "timer_slots: [0-9]+ passed, 0 failed"
