sample:
  name: Isolated UART line-parameter application
  description: Set the secondary UART framing and check it over a loopback
tests:
  sample.app_platform.uart_line:
    platform_allow:
      - esp32c5_devkitc/esp32c5/hpcore
      - esp32c6_devkitc/esp32c6/hpcore
      - qemu_riscv32/qemu_virt_riscv32
      - qemu_riscv32/qemu_virt_riscv32/smp
    tags: app_platform
    build_only: true
