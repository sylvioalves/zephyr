# Build the probe with BLE compiled out so the 802.15.4 radio service can be
# exercised. BLE and 802.15.4 share one radio on this SoC and cannot run at
# once, so the radio echo test runs only in this configuration.
#   west build -b <board> samples/subsys/app_probe -- -DEXTRA_CONF_FILE=radio_only.conf
CONFIG_BT=n
CONFIG_APP_PLATFORM_BLE=n
