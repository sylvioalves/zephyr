sample:
  name: Application platform syscall benchmark
  description: >
    Measure the cost of crossing the syscall boundary and switching between
    isolated applications.
tests:
  sample.subsys.app_bench:
    tags: app_platform
    platform_allow:
      - esp32c5_devkitc/esp32c5/hpcore
      - esp32c6_devkitc/esp32c6/hpcore
    harness: console
    harness_config:
      type: one_line
      regex:
        - "app_bench done"
