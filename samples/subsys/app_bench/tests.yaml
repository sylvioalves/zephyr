sample:
  name: Application platform syscall benchmark
  description: >
    Measure the cost of crossing the syscall boundary and switching between
    isolated applications.
tests:
  sample.subsys.app_bench:
    tags: app_platform
    # User threads read the cycle counter, which the ESP32-C6 does not implement.
    platform_allow:
      - esp32c5_devkitc/esp32c5/hpcore
      - qemu_riscv32/qemu_virt_riscv32
      - qemu_riscv32/qemu_virt_riscv32/smp
    harness: console
    harness_config:
      type: one_line
      regex:
        - "app_bench done"
