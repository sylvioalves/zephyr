sample:
  name: Busy platform application under a polling main thread
  description: >
    Run a busy platform application that makes a syscall on every pass and
    check that a main thread polling every millisecond keeps running.
tests:
  sample.subsys.app_lock:
    tags: app_platform
    platform_allow:
      - esp32c5_devkitc/esp32c5/hpcore
      - esp32c6_devkitc/esp32c6/hpcore
    harness: console
    harness_config:
      type: one_line
      regex:
        - "survived 8 s, no lockup"
