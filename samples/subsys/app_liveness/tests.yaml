sample:
  name: Application liveness model
  description: >
    Reclaim a crashed and a hung application while a busy application keeps
    running.
tests:
  sample.subsys.app_liveness:
    tags: app_platform
    platform_allow:
      - esp32c5_devkitc/esp32c5/hpcore
      - esp32c6_devkitc/esp32c6/hpcore
    ignore_faults: true
    harness: console
    harness_config:
      type: one_line
      regex:
        - "done: crash and hang reclaimed, busy app left running"
