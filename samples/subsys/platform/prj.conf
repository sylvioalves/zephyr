CONFIG_USERSPACE=y
CONFIG_APPLICATION_DEFINED_SYSCALL=y

# The application platform subsystem (manager + loader + registry).
CONFIG_APP_PLATFORM=y
CONFIG_APP_PLATFORM_MAX_APPS=5
CONFIG_APP_PLATFORM_LOADER=y
CONFIG_APP_PLATFORM_REGISTRY=y

# Service drivers the demo applications use.
CONFIG_SENSOR=y
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_COUNTER=y
CONFIG_RTC=y
CONFIG_RTC_INIT_PRIORITY=70

CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_CHANNELS=6

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

# Runtime-loaded app verification (SHA-256 via PSA crypto).
CONFIG_LLEXT=y
CONFIG_LLEXT_HEAP_SIZE=64
CONFIG_LLEXT_TYPE_ELF_RELOCATABLE=y
CONFIG_PSA_CRYPTO=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_PSA_WANT_ALG_SHA_256=y

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_THREAD_NAME=y

CONFIG_MAX_DOMAIN_PARTITIONS=8
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
