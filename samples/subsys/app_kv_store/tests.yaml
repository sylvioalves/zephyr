sample:
  name: Isolated key/value store application
  description: Set, read, overwrite and delete keys namespaced per application
tests:
  sample.app_platform.kv_store:
    platform_allow:
      - esp32c5_devkitc/esp32c5/hpcore
      - esp32c6_devkitc/esp32c6/hpcore
      - qemu_riscv32/qemu_virt_riscv32
      - qemu_riscv32/qemu_virt_riscv32/smp
    tags: app_platform
    harness: console
    harness_config:
      type: one_line
      regex:
        - "kv_store: [0-9]+ passed, 0 failed"
