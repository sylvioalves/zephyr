CONFIG_APPLICATION_DEFINED_SYSCALL=y

CONFIG_APP_PLATFORM=y
CONFIG_APP_PLATFORM_MAX_APPS=4
CONFIG_APP_PLATFORM_SERVICES=y
CONFIG_APP_PLATFORM_BUS=y
CONFIG_APP_PLATFORM_RING=y

# APP_PLATFORM_BUS covers I2C, SPI and the secondary UART together, so all
# three subsystems must be present even though only the UART is used here.
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_SERIAL=y
CONFIG_ENTROPY_GENERATOR=y

CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_CHANNELS=6

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_THREAD_NAME=y

CONFIG_MAIN_STACK_SIZE=4096

# app_svc_ring_bind allocates the mapped buffer from the kernel heap.
CONFIG_HEAP_MEM_POOL_SIZE=16384
