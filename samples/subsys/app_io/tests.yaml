sample:
  name: Isolated I/O application
  description: >
    Give a user-mode application a granted LED and button, with every other pin out of reach.
tests:
  sample.subsys.app_io:
    tags: app_platform
    platform_allow:
      - esp32c5_devkitc/esp32c5/hpcore
      - esp32c6_devkitc/esp32c6/hpcore
      - qemu_riscv32/qemu_virt_riscv32
      - qemu_riscv32/qemu_virt_riscv32/smp
      - esp32p4x_function_ev_board/esp32p4/hpcore
    harness: console
    harness_config:
      type: one_line
      regex:
        - "launched isolated io app"
