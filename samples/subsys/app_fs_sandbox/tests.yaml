sample:
  name: Per-application sandboxed filesystem
  description: >
    Confine an application's file access to its own directory and deny every
    path that escapes it.
tests:
  sample.subsys.app_fs_sandbox:
    tags: app_platform
    platform_allow:
      - esp32c5_devkitc/esp32c5/hpcore
      - esp32c6_devkitc/esp32c6/hpcore
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "read config.txt \\(14 bytes\\): brightness=80"
        - "-> rc=-13 \\(DENIED\\)"
        - "-> rc=-13 \\(DENIED\\)"
        - "-> rc=-13 \\(DENIED\\)"
        - "done: app used its private storage; all escapes denied"
