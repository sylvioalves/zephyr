CONFIG_APPLICATION_DEFINED_SYSCALL=y

CONFIG_APP_PLATFORM=y
CONFIG_APP_PLATFORM_MAX_APPS=4
CONFIG_APP_PLATFORM_SERVICES=y
CONFIG_APP_PLATFORM_BLE=y
CONFIG_APP_PLATFORM_BLE_GATT=y
CONFIG_APP_PLATFORM_BLE_SERVE=y
CONFIG_APP_PLATFORM_IO=y
CONFIG_APP_PLATFORM_EVENTS=y

CONFIG_GPIO=y
CONFIG_ENTROPY_GENERATOR=y

CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_CHANNELS=6

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_THREAD_NAME=y

CONFIG_MAIN_STACK_SIZE=4096
# Registering a service and advertising runs on these stacks.
CONFIG_APP_PLATFORM_SUPERVISOR_STACK_SIZE=8192
CONFIG_APP_PLATFORM_APP_STACK_SIZE=8192

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_GATT_SERVICE_CHANGED=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_DEVICE_NAME="c5-app"
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
# One slot is taken by the client role app_ble.c also builds in.
CONFIG_BT_MAX_CONN=2
