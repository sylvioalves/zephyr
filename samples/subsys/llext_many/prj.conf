CONFIG_USERSPACE=y
CONFIG_APPLICATION_DEFINED_SYSCALL=y

CONFIG_APP_PLATFORM=y
# Number of parallel loadable apps. Raise this to launch more (and bump
# CONFIG_MAX_THREAD_BYTES with it). With the loadable-extension heap placed in
# external RAM (see below) the limit becomes the per-app thread stacks in
# internal SRAM, not the loaded module images.
CONFIG_APP_PLATFORM_MAX_APPS=16
CONFIG_APP_PLATFORM_LOADER=y
CONFIG_APP_PLATFORM_SERVICES=y

CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_CHANNELS=60
CONFIG_TASK_WDT_HW_FALLBACK=n

# Use a runtime llext heap so the sample can place it in external RAM (PSRAM)
# instead of reserving a fixed block of internal SRAM.
CONFIG_LLEXT=y
CONFIG_LLEXT_HEAP_DYNAMIC=y
CONFIG_LLEXT_TYPE_ELF_RELOCATABLE=y

# External RAM (PSRAM) holds the loadable-extension heap.
CONFIG_ESP_SPIRAM=y
CONFIG_ESP_SPIRAM_SIZE=8388608
CONFIG_SHARED_MULTI_HEAP=y

CONFIG_PSA_CRYPTO=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_PSA_WANT_ALG_SHA_256=y

CONFIG_ENTROPY_GENERATOR=y

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_THREAD_NAME=y

CONFIG_MAX_DOMAIN_PARTITIONS=8
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_MAX_THREAD_BYTES=13
