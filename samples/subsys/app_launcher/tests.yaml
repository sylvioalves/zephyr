sample:
  name: Application launcher
  description: >
    List isolated applications as tiles in an LVGL user interface and start or
    stop each one.
tests:
  sample.subsys.app_launcher:
    tags: app_platform
    platform_allow:
      - esp32c5_devkitc/esp32c5/hpcore
      - esp32c6_devkitc/esp32c6/hpcore
      - qemu_riscv32/qemu_virt_riscv32
      - qemu_riscv32/qemu_virt_riscv32/smp
    build_only: true
