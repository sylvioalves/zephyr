sample:
  name: Application lifecycle measurements
  description: >
    Measure load, launch and reclaim times and the memory footprint of
    loadable applications.
tests:
  sample.subsys.app_meas:
    tags: app_platform
    platform_allow:
      - esp32c5_devkitc/esp32c5/hpcore
      - esp32c6_devkitc/esp32c6/hpcore
    ignore_faults: true
    harness: console
    harness_config:
      type: one_line
      regex:
        - "app_meas done"
