CONFIG_USERSPACE=y
CONFIG_APPLICATION_DEFINED_SYSCALL=y

CONFIG_APP_PLATFORM=y
CONFIG_APP_PLATFORM_MAX_APPS=4
CONFIG_APP_PLATFORM_SERVICES=y
CONFIG_APP_PLATFORM_PSRAM=y

CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_CHANNELS=6
# These apps are not monitored, so nothing feeds the task watchdog during the
# sustained stress loop; disable its hardware fallback so it cannot reset the
# device while the apps are busy.
CONFIG_TASK_WDT_HW_FALLBACK=n

# External RAM (PSRAM) on the C5.
CONFIG_ESP_SPIRAM=y
CONFIG_ESP_SPIRAM_SIZE=8388608
CONFIG_SHARED_MULTI_HEAP=y

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_THREAD_NAME=y

CONFIG_MAX_DOMAIN_PARTITIONS=8
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_ENTROPY_GENERATOR=y
