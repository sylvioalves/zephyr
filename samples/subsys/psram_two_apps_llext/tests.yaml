sample:
  name: Private external RAM for two loadable applications
  description: >
    Stress two loadable applications, each on its own private region of
    external RAM.
tests:
  sample.subsys.psram_two_apps_llext:
    tags: app_platform
    platform_allow:
      - esp32c5_devkitc/esp32c5/hpcore
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "stress iters=[0-9]+ err=0 OK"
        - "stress iters=[0-9]+ err=0 OK"
        - "done: two loadable apps each stressed a private region"
